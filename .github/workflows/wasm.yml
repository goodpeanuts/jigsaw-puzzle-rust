name: WASM and Trunk

on:
  push:
    branches: [ wasm ]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'index.html'
      - '.github/workflows/wasm.yml'
  pull_request:
    branches: [ wasm ]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'index.html'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  wasm-build:
    name: WASM Build and Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features:
          - ""
          - "debug"
          - "chinese"
          - "debug,chinese"

    steps:
      - uses: actions/checkout@v4
      
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm-${{ matrix.features }}

      # 安装 WASM 工具
      - name: Install WASM tools
        run: |
          cargo install wasm-bindgen-cli --version 0.2.100
          cargo install wasm-pack

      # 构建 WASM
      - name: Build WASM
        run: |
          if [ "${{ matrix.features }}" = "" ]; then
            cargo build --target wasm32-unknown-unknown --release
          else
            cargo build --target wasm32-unknown-unknown --release --features "${{ matrix.features }}"
          fi

      # 生成绑定
      - name: Generate WASM bindings
        run: |
          wasm-bindgen --out-dir pkg --target web --typescript target/wasm32-unknown-unknown/release/puzzle.wasm

      # 验证生成的文件
      - name: Verify WASM outputs
        run: |
          ls -la pkg/
          test -f pkg/puzzle.js
          test -f pkg/puzzle_bg.wasm
          test -f pkg/puzzle.d.ts

      # 上传 WASM 构建产物
      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-${{ matrix.features || 'default' }}
          path: pkg/

  trunk-build:
    name: Trunk Build and Serve Test
    runs-on: ubuntu-latest
    needs: [wasm-build]
    strategy:
      matrix:
        features:
          - ""
          - "debug"
          - "chinese"
          - "debug,chinese"

    steps:
      - uses: actions/checkout@v4
      
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      
      - uses: Swatinem/rust-cache@v2

      # 安装 Trunk
      - name: Install Trunk
        run: cargo install --locked trunk

      # 安装 wasm-bindgen-cli
      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.100

      # 确保 index.html 存在
      - name: Check index.html
        run: |
          if [ ! -f index.html ]; then
            echo "Creating default index.html"
            cat > index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
              <title>Jigsaw Puzzle Game</title>
              <link data-trunk rel="rust" data-wasm-opt="2" />
              <base data-trunk-public-url />
              <style>
                  body {
                      margin: 0;
                      padding: 0;
                      background: #1e1e1e;
                      color: white;
                      font-family: Arial, sans-serif;
                      display: flex;
                      flex-direction: column;
                      align-items: center;
                      justify-content: center;
                      min-height: 100vh;
                  }
                  #loading_text {
                      font-size: 18px;
                      margin: 20px;
                  }
                  #the_canvas_id {
                      border: 1px solid #444;
                      border-radius: 8px;
                  }
              </style>
          </head>
          <body>
              <div id="loading_text">🧩 Loading Puzzle Game...</div>
              <canvas id="the_canvas_id"></canvas>
          </body>
          </html>
          EOF
          fi
          echo "✅ index.html ready"

      # Trunk 构建
      - name: Trunk build
        run: |
          echo "Building with features: ${{ matrix.features }}"
          if [ "${{ matrix.features }}" = "" ]; then
            trunk build --release
          else
            # 设置 Cargo 特性环境变量
            export CARGO_FEATURES="${{ matrix.features }}"
            trunk build --release
          fi

      # 验证构建产物
      - name: Verify build artifacts
        run: |
          echo "📁 Checking dist/ directory:"
          ls -la dist/
          
          echo "✅ Verifying required files:"
          test -f dist/index.html && echo "  ✓ index.html found"
          
          # 查找 JS 和 WASM 文件 (文件名包含哈希)
          JS_FILE=$(find dist -name "*.js" | head -1)
          WASM_FILE=$(find dist -name "*.wasm" | head -1)
          
          if [ -n "$JS_FILE" ]; then
            echo "  ✓ JavaScript file found: $(basename "$JS_FILE")"
          else
            echo "  ❌ No JavaScript file found"
            exit 1
          fi
          
          if [ -n "$WASM_FILE" ]; then
            echo "  ✓ WASM file found: $(basename "$WASM_FILE")"
          else
            echo "  ❌ No WASM file found"
            exit 1
          fi

      # 启动服务器测试
      - name: Test trunk serve
        run: |
          echo "🚀 Starting trunk serve..."
          
          # 启动 trunk serve 并获取 PID
          trunk serve --port 8080 &
          TRUNK_PID=$!
          
          echo "⏳ Waiting for server to start..."
          sleep 15
          
          # 检查进程是否还在运行
          if ! kill -0 $TRUNK_PID 2>/dev/null; then
            echo "❌ Trunk serve process died"
            exit 1
          fi
          
          echo "🧪 Testing server endpoints..."
          
          # 测试主页
          if curl -f -s http://localhost:8080/ > /dev/null; then
            echo "  ✓ Main page accessible"
          else
            echo "  ❌ Main page not accessible"
            kill $TRUNK_PID 2>/dev/null || true
            exit 1
          fi
          
          # 测试 JavaScript 文件
          JS_PATH=$(curl -s http://localhost:8080/ | grep -o '[^"]*\.js' | head -1)
          if [ -n "$JS_PATH" ] && curl -f -s "http://localhost:8080/$JS_PATH" > /dev/null; then
            echo "  ✓ JavaScript file accessible: $JS_PATH"
          else
            echo "  ⚠️  JavaScript file test skipped (dynamic path)"
          fi
          
          # 测试 WASM 文件
          WASM_PATH=$(curl -s http://localhost:8080/ | grep -o '[^"]*\.wasm' | head -1)
          if [ -n "$WASM_PATH" ] && curl -f -s "http://localhost:8080/$WASM_PATH" > /dev/null; then
            echo "  ✓ WASM file accessible: $WASM_PATH"
          else
            echo "  ⚠️  WASM file test skipped (dynamic path)"
          fi
          
          echo "✅ All server tests passed!"
          
          # 清理
          kill $TRUNK_PID 2>/dev/null || true
          wait $TRUNK_PID 2>/dev/null || true

      # 上传构建产物
      - name: Upload Trunk build
        uses: actions/upload-artifact@v4
        with:
          name: trunk-build-${{ matrix.features || 'default' }}
          path: dist/
          retention-days: 7

  # 集成测试
  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: [trunk-build]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: List all artifacts
        run: |
          echo "📦 All build artifacts:"
          find artifacts/ -type f | sort

      - name: Integration summary
        run: |
          echo "🎉 WASM and Trunk integration tests completed successfully!"
          echo "Features tested: default, debug, chinese, debug+chinese"
          echo "All builds can be found in the artifacts."
