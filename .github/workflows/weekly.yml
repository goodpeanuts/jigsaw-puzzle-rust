name: Weekly Build

on:
  # 北京时间每周二凌晨4点 (UTC每周一20点)
  schedule:
    - cron: '0 20 * * 1'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  weekly-check:
    name: Weekly Full Platform Check
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # macOS - aarch64
          - os: macos-latest
            target: aarch64-apple-darwin
            features: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            features: "debug,chinese"
          
          # Windows - x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            features: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            features: "debug,chinese"
          
          # Linux - x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            features: ""
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            features: "debug,chinese"
          
          # Ubuntu - WASM
          - os: ubuntu-latest
            target: wasm32-unknown-unknown
            features: ""
          - os: ubuntu-latest
            target: wasm32-unknown-unknown
            features: "debug,chinese"

    steps:
      - uses: actions/checkout@v4
      
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      
      - uses: Swatinem/rust-cache@v2

      # 平台特定安装
      - name: Install platform dependencies
        run: |
          if [[ "${{ matrix.target }}" == "wasm32-unknown-unknown" ]]; then
            cargo install wasm-bindgen-cli --version 0.2.100
            cargo install --locked trunk
          elif [[ "${{ matrix.target }}" == "aarch64-apple-darwin" ]]; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          elif [[ "${{ matrix.target }}" == "x86_64-unknown-linux-gnu" ]]; then
            sudo apt-get update
            sudo apt-get install -y libwayland-dev libxkbcommon-dev
          fi
        shell: bash

      - name: Install Windows MSVC
        if: matrix.target == 'x86_64-pc-windows-msvc'
        uses: ilammy/msvc-dev-cmd@v1

      # 格式检查
      - name: Check format
        run: cargo fmt --all -- --check

      # Clippy 检查
      - name: Clippy check
        run: |
          if [ "${{ matrix.features }}" = "" ]; then
            cargo clippy --target ${{ matrix.target }} --all-targets -- -D warnings
          else
            cargo clippy --target ${{ matrix.target }} --all-targets --features "${{ matrix.features }}" -- -D warnings
          fi
        shell: bash

      # 编译检查
      - name: Build check
        run: |
          if [ "${{ matrix.features }}" = "" ]; then
            cargo build --target ${{ matrix.target }} --release
          else
            cargo build --target ${{ matrix.target }} --release --features "${{ matrix.features }}"
          fi
        shell: bash

      # 测试 (非 WASM)
      - name: Run tests
        if: matrix.target != 'wasm32-unknown-unknown'
        run: |
          if [ "${{ matrix.features }}" = "" ]; then
            cargo test --target ${{ matrix.target }}
          else
            cargo test --target ${{ matrix.target }} --features "${{ matrix.features }}"
          fi
        shell: bash

      # WASM 特殊测试
      - name: WASM specific tests
        if: matrix.target == 'wasm32-unknown-unknown'
        run: |
          # 生成 WASM 绑定
          wasm-bindgen --out-dir pkg --target web target/wasm32-unknown-unknown/release/puzzle.wasm
          
          # 创建测试用 index.html
          cat > index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
              <title>Puzzle Game Weekly Test</title>
              <link data-trunk rel="rust" data-wasm-opt="2" />
              <base data-trunk-public-url />
          </head>
          <body>
              <div id="loading_text">Loading...</div>
              <canvas id="the_canvas_id"></canvas>
          </body>
          </html>
          EOF
          
          # Trunk 构建测试
          if [ "${{ matrix.features }}" = "" ]; then
            trunk build --release
          else
            CARGO_FEATURES="${{ matrix.features }}" trunk build --release
          fi
          
          # 验证产物
          ls -la dist/
          test -f dist/index.html
          
          # 启动服务器测试 (超时30秒)
          timeout 30 trunk serve --port 8080 &
          TRUNK_PID=$!
          sleep 10
          
          # 测试服务器
          curl -f http://localhost:8080/ > /dev/null || echo "Server test completed"
          
          # 清理
          kill $TRUNK_PID 2>/dev/null || true

  # 汇总报告
  weekly-summary:
    name: Weekly Summary
    runs-on: ubuntu-latest
    needs: [weekly-check]
    if: always()
    
    steps:
      - name: Check results
        run: |
          echo "Weekly build completed!"
          echo "Check results: ${{ needs.weekly-check.result }}"
          
          if [ "${{ needs.weekly-check.result }}" = "failure" ]; then
            echo "❌ Some builds failed"
            exit 1
          else
            echo "✅ All builds passed"
          fi
