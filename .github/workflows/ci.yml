name: CI

on:
  push:
    branches: [ wasm ]
  pull_request:
    branches: [ wasm ]
  # 定时任务：北京时间周二4点 (UTC周一20点)
  schedule:
    - cron: '0 20 * * 1'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # 检查代码格式和 Clippy
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      
      - name: Check formatting
        run: cargo fmt --all -- --check
      
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  # 多平台编译和测试
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        target: 
          - aarch64-apple-darwin
          - wasm32-unknown-unknown
          - x86_64-pc-windows-msvc
          - x86_64-unknown-linux-gnu
        features:
          - ""
          - "debug"
          - "chinese"
          - "debug,chinese"
        exclude:
          # 排除不兼容的组合
          - os: ubuntu-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: x86_64-unknown-linux-gnu
          # WASM 目标只在 Ubuntu 上测试
          - os: windows-latest
            target: wasm32-unknown-unknown
          - os: macos-latest
            target: wasm32-unknown-unknown

    steps:
      - uses: actions/checkout@v4
      
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ matrix.target }}-${{ matrix.features }}

      # Linux 需要额外的依赖
      - name: Install Linux dependencies
        if: matrix.target == 'x86_64-unknown-linux-gnu' && matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev

      # macOS 需要额外设置 aarch64 交叉编译
      - name: Install macOS cross-compilation tools
        if: matrix.target == 'aarch64-apple-darwin' && matrix.os == 'macos-latest'
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          rustup target add aarch64-apple-darwin

      # Windows 需要 MSVC 工具链
      - name: Install Windows MSVC
        if: matrix.target == 'x86_64-pc-windows-msvc' && matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      # WASM 特殊依赖
      - name: Install WASM dependencies
        if: matrix.target == 'wasm32-unknown-unknown'
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.100

      # 编译检查
      - name: Check compilation
        run: |
          if [ "${{ matrix.features }}" = "" ]; then
            cargo check --target ${{ matrix.target }}
          else
            cargo check --target ${{ matrix.target }} --features "${{ matrix.features }}"
          fi
        shell: bash

      # 运行测试 (非 WASM 平台)
      - name: Run tests
        if: matrix.target != 'wasm32-unknown-unknown'
        run: |
          if [ "${{ matrix.features }}" = "" ]; then
            cargo test --target ${{ matrix.target }}
          else
            cargo test --target ${{ matrix.target }} --features "${{ matrix.features }}"
          fi
        shell: bash

      # WASM 构建测试
      - name: Build WASM
        if: matrix.target == 'wasm32-unknown-unknown'
        run: |
          if [ "${{ matrix.features }}" = "" ]; then
            cargo build --target ${{ matrix.target }} --release
          else
            cargo build --target ${{ matrix.target }} --release --features "${{ matrix.features }}"
          fi
          # 生成 WASM 绑定
          wasm-bindgen --out-dir pkg --target web target/wasm32-unknown-unknown/release/puzzle.wasm
        shell: bash

  # Trunk 构建和测试
  trunk-test:
    name: Trunk Build Test
    runs-on: ubuntu-latest
    needs: [check]
    strategy:
      matrix:
        features:
          - ""
          - "debug"
          - "chinese"
          - "debug,chinese"

    steps:
      - uses: actions/checkout@v4
      
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      
      - uses: Swatinem/rust-cache@v2
        with:
          key: trunk-${{ matrix.features }}

      # 安装 trunk
      - name: Install trunk
        run: cargo install --locked trunk

      # 安装 wasm-bindgen-cli
      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.100

      # 创建临时的 index.html (如果不存在)
      - name: Ensure index.html exists
        run: |
          if [ ! -f index.html ]; then
            cat > index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
              <title>Puzzle Game</title>
              <link data-trunk rel="rust" data-wasm-opt="2" />
              <base data-trunk-public-url />
          </head>
          <body>
              <div id="loading_text">Loading...</div>
              <canvas id="the_canvas_id"></canvas>
          </body>
          </html>
          EOF
          fi

      # Trunk 构建测试
      - name: Trunk build
        run: |
          if [ "${{ matrix.features }}" = "" ]; then
            trunk build --release
          else
            CARGO_FEATURES="${{ matrix.features }}" trunk build --release
          fi

      # 验证构建产物
      - name: Verify build artifacts
        run: |
          ls -la dist/
          test -f dist/index.html
          ls dist/*.js > /dev/null 2>&1
          ls dist/*.wasm > /dev/null 2>&1

      # 启动服务器并测试
      - name: Test trunk serve
        run: |
          # 启动 trunk serve 在后台
          timeout 30 trunk serve --port 8080 &
          TRUNK_PID=$!
          
          # 等待服务器启动
          sleep 10
          
          # 测试服务器响应
          curl -f http://localhost:8080/ > /dev/null || (echo "Trunk serve failed" && exit 1)
          
          # 检查 WASM 文件是否可访问
          WASM_FILE=$(curl -s http://localhost:8080/ | grep -oE '[^"]+\.wasm' | head -n1)
          if [ -n "$WASM_FILE" ]; then
            curl -f "http://localhost:8080/$WASM_FILE" > /dev/null || (echo "WASM file not accessible" && exit 1)
          else
            echo "No WASM file found in HTML"
            exit 1
          fi
          
          # 清理
          kill $TRUNK_PID 2>/dev/null || true

  # 发布构建 (仅在主分支)
  release:
    name: Release Build
    runs-on: ubuntu-latest
    needs: [test, trunk-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      
      - uses: Swatinem/rust-cache@v2

      # 安装构建工具
      - name: Install build tools
        run: |
          cargo install --locked trunk
          cargo install wasm-bindgen-cli --version 0.2.100

      # 构建发布版本
      - name: Build release
        run: |
          trunk build --release
          
      # 上传构建产物
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-build
          path: dist/
          retention-days: 30

      # 如果有 GitHub Pages，可以部署
      - name: Deploy to GitHub Pages
        if: github.repository_owner == 'goodpeanuts'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
